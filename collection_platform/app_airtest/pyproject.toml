[project]
name = "airtest-automation"
version = "0.1.0"
description = "Airtest + Poco 纯代码自动化"
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = [
    "airtest>=1.3.0",
    "pocoui>=1.0.86",
]

[tool.setuptools]
packages = ["app_airtest"]
package-dir = { app_airtest = "." }


[tool.uv]
override-dependencies = [
    "pywin32; sys_platform == 'win32'",
]
