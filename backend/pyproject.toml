[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend for Data Collection Platform"
requires-python = ">=3.11.8"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "ai-agent",
    "common",
]

[tool.uv.sources]
ai-agent = { workspace = true }
common = { workspace = true }
